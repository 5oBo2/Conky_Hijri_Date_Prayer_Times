conky.config = {
    update_interval = 0.5,
    minimum_width = 510,
    minimum_height = 150,
    out_to_x = false,
    out_to_wayland = true,
    own_window = true,
    own_window_class = 'ConkyMouseProbe',
    own_window_title = 'Conky mouse test (native Wayland)',
    own_window_type = 'normal',
    own_window_hints = 'above',
    own_window_colour = '#f222',
    double_buffer = true,
    use_xft = true,
    font = 'DejaVu Sans Mono:size=12',
    default_color = 'white',
    lua_load = base .. 'conky_mouse_probe.lua',
    lua_mouse_hook = 'on_mouse',
    alignment = 'top_left',
    gap_x = 80,
    gap_y = 80,
}
conky.text = [[
Native Wayland mouse test (comparison only)
Move the pointer here, then left-click several times.
Watch the TERMINAL for ENTER/MOVE and BUTTON_DOWN/UP.
