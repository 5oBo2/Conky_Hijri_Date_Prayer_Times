# ONE shared configuration for all four Conky widgets.
# You may edit this file or run: python3 configure.py
# Restart affected widgets after changing it: python3 restart.py

[location]
# `coordinates` or `city`; one location powers prayer, Hijri, weather and sun.
mode = coordinates
city = Cairo
country = Egypt
state =
latitude = 29.972531
longitude = 31.513482
# Prayer method: auto (Aladhan default), or an Aladhan numeric method ID.
method = auto
school = 0
midnight_mode = 1

[appearance]
# Every widget has an independent scale, but all use one font.
# Valid scales: 0.3 to 3.0.
# TIP: Replace with a Medium/Regular/Book font from `fc-list` if XLt is still too thin.
font = ITC Avant Garde Pro XLt
prayer_scale = 1.71
date_scale = 2.468
weather_scale = 2.438
# sun_moon controls the transparent Celestial Astrolabe.
sun_moon_scale = 2.25
# Weather icon positioning (local logical widget pixels, before weather_scale).
weather_icon_x = 122
weather_icon_y = 0
weather_icon_size = 108

# Controls ONLY the Date widget (the standalone Weather widget always stays on):
#   date_only        = clock + Gregorian/Hijri date, no temperature in Date
#   date_and_weather = clock + temperature/hover weather + Gregorian/Hijri date
# Switching modes never hides, moves, resizes, or disables standalone Weather.
date_weather_mode = date_and_weather
# Unscaled sizes (multiplied by date_scale) for Date's weather header:
date_weather_clock_size = 145
date_weather_hover_temp_size = 82
date_weather_icon_size = 72
date_weather_icon_dx = 0
date_weather_icon_dy = 0

[behavior]
# Prayer and Date widget behavior.
elapsed_minutes = 60
hover_area = fajr_sunrise
hover_debug_outline = no
hover_failsafe_seconds = 1
# Only used for the weather details hover INSIDE the Date widget.
date_weather_hover_failsafe_seconds = 4
hijri_offset_days = 0
athan_enabled = yes
# Shared Open-Meteo weather and sun data refresh interval: 5..180 minutes.
weather_refresh_minutes = 20

[placement]
# Absolute virtual-desktop X/Y. Use `python3 configure.py --layout` to place
# each widget on any monitor without manually calculating these coordinates.
# Full-screen dashboard layout for Monitor 2 (eDP-1: 1920x1080 at 0,1080).
prayer_x = 19
prayer_y = 1719
date_x = 96
date_y = 1100
# Customize each widget's position independently.
weather_x = 1000
weather_y = 1085
# Celestial Astrolabe position.
sun_moon_x = 492
sun_moon_y = 54
