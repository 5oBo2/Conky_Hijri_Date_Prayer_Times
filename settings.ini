# ONE shared configuration for all four Conky widgets.
# You may edit this file or run: python3 configure.py
# Restart affected widgets after changing it: python3 restart.py

[location]
# `coordinates` or `city`; one location powers prayer, Hijri, weather and sun.
mode = coordinates
city = Cairo
country = Egypt
state =










latitude = 29.9725276
longitude = 31.5135359
# Prayer method: auto (Aladhan default), or an Aladhan numeric method ID.
method = auto
school = 0
midnight_mode = 1

[appearance]
# Every widget has an independent scale, but all use one font.
# Valid scales: 0.3 to 3.0.
# TIP: Replace with a Medium/Regular/Book font from `fc-list` if XLt is still too thin.
font = ITC Avant Garde Pro XLt
prayer_scale = 1.71
date_scale = 2.468
weather_scale = 2.0
# sun_moon controls the transparent Celestial Astrolabe.
sun_moon_scale = 2.25
# Weather icon positioning (local logical widget pixels, before weather_scale).
weather_icon_x = 130
weather_icon_y = -13
weather_icon_size = 137

# Controls ONLY the Date widget (the standalone Weather widget always stays on):
#   date_only        = clock + Gregorian/Hijri date, no temperature in Date
#   date_and_weather = clock + temperature/hover weather + Gregorian/Hijri date
# Switching modes never hides, moves, resizes, or disables standalone Weather.
date_weather_mode = date_and_weather
# Unscaled sizes (multiplied by date_scale) for Date's weather header:
date_weather_clock_size = 145
date_weather_hover_temp_size = 82
date_weather_icon_size = 72
date_weather_icon_dx = 0
date_weather_icon_dy = 0

[behavior]
# Prayer and Date widget behavior.
elapsed_minutes = 60
hover_debug_outline = no
hover_failsafe_seconds = 0
# Only used for the weather details hover INSIDE the Date widget.
date_weather_hover_failsafe_seconds = 0
hijri_offset_days = 0
athan_enabled = yes
# notify-send reminders for 5 prayers, Sunrise/Midnight, and Islamic White Days.
notifications_enabled = yes
# 0 disables pre-event reminders; valid range is 0..60 minutes.
notify_prayer_minutes = 15
# At Maghrib before Hijri days 13/14/15 (except Ramadan month 9).
notify_fasting_days = yes
# Shared Open-Meteo weather and sun data refresh interval: 5..180 minutes.
weather_refresh_minutes = 20

[placement]
# X11/XWayland virtual-desktop coordinates passed to Conky gap_x/gap_y.
# Recalculate via configure.py --reflow-layout after switching back.
# Monitor/anchor/margins are recorded in [layout] when using --layout.
prayer_x = 19
prayer_y = 1719
date_x = 96
date_y = 1085
# Customize each widget's position independently.
weather_x = 20
weather_y = 20
# Celestial Astrolabe position.
sun_moon_x = 492
sun_moon_y = 54

# Optional intent is recorded here automatically by `configure.py --layout`:
# [layout] widgets' <kind>_output/_anchor/_margin_x/_margin_y.
# The output name and anchor generate global X11/XWayland coordinates.

[layout]
prayer_output = eDP-1
prayer_anchor = bottom-center
prayer_margin_x = 5
prayer_margin_y = 5
date_output = eDP-1
date_anchor = top-center
date_margin_x = 5
date_margin_y = 5
weather_output = HDMI-A-1
weather_anchor = top-left
weather_margin_x = 20
weather_margin_y = 20
sun_moon_output = HDMI-A-1
sun_moon_anchor = center
sun_moon_margin_x = 20
sun_moon_margin_y = 20
