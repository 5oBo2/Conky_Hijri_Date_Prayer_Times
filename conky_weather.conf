local path = debug.getinfo(1, 'S').source:match('^@(.*/)') or (os.getenv('HOME') .. '/.config/conky/')
local settings = dofile(path .. 'Settings.lua')
local scale = settings.scale('weather')
local combined = settings.boolean('appearance', 'clock_weather_combined', false)
conky.config = {
    update_interval = combined and 5 or 1,
    font = settings.get('appearance', 'font', 'DejaVu Sans') .. ':size=10', -- match shared font
    minimum_width = combined and 1 or math.floor(340 * scale + .5),
    minimum_height = combined and 1 or math.floor(172 * scale + .5),
    own_window = true,
    own_window_class = 'ConkyWeather',
    own_window_type = 'normal',
    own_window_hints = 'undecorated,below,skip_taskbar,skip_pager,sticky',
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    own_window_transparent = true,
    double_buffer = true,
    lua_load = path .. 'Weather.lua',
    lua_draw_hook_post = 'main',
    alignment = 'top_left',
    gap_x = combined and 0 or math.floor(settings.number('placement', 'weather_x', 40)),
    gap_y = combined and 0 or math.floor(settings.number('placement', 'weather_y', 40)),
}
conky.text = [[ ]]