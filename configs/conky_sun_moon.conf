-- Canonical Sun/Moon window: TRANSPARENT CELESTIAL ASTROLABE ONLY.
-- Shares settings.ini, location/data caches and the font with the other widgets.
local path = debug.getinfo(1, 'S').source:match('^@(.*/)') or './configs/'
local root = path .. '../'
local settings = dofile(root .. 'lib/Settings.lua')
local geometry = dofile(root .. 'lib/Widget_Geometry.lua')
local scale = settings.scale('sun_moon')
conky.config = {
    update_interval = 1,
    font = settings.get('appearance', 'font', 'DejaVu Sans') .. ':size=10',
    minimum_width = geometry.dimension('sun_moon', 'width', scale),
    minimum_height = geometry.dimension('sun_moon', 'height', scale),
    out_to_x = true,
    out_to_wayland = false,
    own_window = true,
    own_window_class = 'ConkySunMoonAstrolabe',
    own_window_type = 'normal',
    own_window_hints = 'undecorated,below,skip_taskbar,skip_pager,sticky',
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    own_window_transparent = true,
    double_buffer = true,
    lua_load = root .. 'widgets/Sun_Moon_Astrolabe.lua',
    lua_draw_hook_post = 'main',
    alignment = 'top_left',
    gap_x = math.floor(settings.number('placement', 'sun_moon_x')),
    gap_y = math.floor(settings.number('placement', 'sun_moon_y')),
}
conky.text = [[ ]]
