-- Uses settings.ini; don't edit this file for font size, location or placement.
local path = (debug.getinfo(1, 'S').source:match('^@(.*/)') or
              './configs/')
local root = path .. '../'
local settings = dofile(root .. 'lib/Settings.lua')
local geometry = dofile(root .. 'lib/Widget_Geometry.lua')
local scale = settings.scale('date')
-- Only changes the Date window's drawing and hover update rate.
local date_show_weather = settings.date_weather_mode() == 'date_and_weather'
conky.config = {
    update_interval = date_show_weather and 0.25 or 1,
    minimum_width = geometry.dimension('date', 'width', scale),
    minimum_height = geometry.dimension('date', 'height', scale),
    out_to_x = true,
    out_to_wayland = false,
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'normal',
    own_window_hints = 'undecorated,below,skip_taskbar,skip_pager,sticky',
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    own_window_transparent = true,
    double_buffer = false,
    lua_load = '/tmp/conky_cairo_probe.lua',
    lua_draw_hook_post = 'probe',
    alignment = 'top_left',
    gap_x = math.floor(settings.number('placement', 'date_x')),
    gap_y = math.floor(settings.number('placement', 'date_y')),
}
conky.text = [[ ]]
