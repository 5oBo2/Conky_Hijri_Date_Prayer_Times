-- Full-screen visual comparison of the original weather PNGs and Cairo vectors.
-- Launch with: python3 tools/weather_icon_probe.py
local path = debug.getinfo(1, 'S').source:match('^@(.*/)') or './configs/'
local root = path .. '../'
local function env_number(name, fallback)
    return tonumber(os.getenv(name) or '') or fallback
end
local screen_width = env_number('CONKY_WEATHER_PROBE_WIDTH', 1920)
local screen_height = env_number('CONKY_WEATHER_PROBE_HEIGHT', 1080)
local screen_x = env_number('CONKY_WEATHER_PROBE_X', 0)
local screen_y = env_number('CONKY_WEATHER_PROBE_Y', 0)
local settings = dofile(root .. 'lib/Settings.lua')

conky.config = {
    update_interval = 1,
    minimum_width = screen_width,
    minimum_height = screen_height,
    out_to_x = true,
    out_to_wayland = false,
    own_window = true,
    own_window_class = 'ConkyWeatherIconProbe',
    own_window_title = 'Weather icon comparison — original PNG vs Cairo vector',
    own_window_type = 'override',
    own_window_hints = 'undecorated,sticky,skip_taskbar,skip_pager',
    own_window_argb_visual = true,
    own_window_argb_value = 255,
    own_window_transparent = false,
    own_window_colour = '#1e1e1e',
    draw_borders = false,
    draw_shades = false,
    border_inner_margin = 0,
    border_outer_margin = 0,
    double_buffer = true,
    use_xft = true,
    font = settings.get('appearance', 'font', 'DejaVu Sans') .. ':size=10',
    default_color = 'white',
    lua_load = root .. 'widgets/Weather_Icon_Probe.lua',
    lua_draw_hook_post = 'main',
    lua_mouse_hook = 'on_mouse',
    alignment = 'top_left',
    gap_x = screen_x,
    gap_y = screen_y,
}

conky.text = [[ ]]
