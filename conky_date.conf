-- Uses settings.ini; don't edit this file for font size, location or placement.
local path = (debug.getinfo(1, 'S').source:match('^@(.*/)') or
              (os.getenv('HOME') .. '/.config/conky/'))
local settings = dofile(path .. 'Settings.lua')
local scale = settings.scale('date')
local combined = settings.boolean('appearance', 'clock_weather_combined', false)
conky.config = {
    update_interval = combined and 0.25 or 1,
    minimum_width = math.floor(700 * scale + 0.5),
    minimum_height = math.floor(290 * scale + 0.5),
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'normal',
    own_window_hints = 'undecorated,below,skip_taskbar,skip_pager,sticky',
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    own_window_transparent = true,
    double_buffer = true,
    lua_load = path .. 'Hijri_Date.lua',
    lua_draw_hook_post = 'main',
    lua_mouse_hook = 'on_mouse',
    alignment = 'top_left',
    gap_x = math.floor(settings.number('placement', 'date_x', 3200)),
    gap_y = math.floor(settings.number('placement', 'date_y', 75)),
}
conky.text = [[ ]]