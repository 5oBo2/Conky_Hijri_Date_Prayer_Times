-- Uses settings.ini; don't edit this file for font size, location or placement.
local path = (debug.getinfo(1, 'S').source:match('^@(.*/)') or
              (os.getenv('HOME') .. '/.config/conky/'))
local settings = dofile(path .. 'Settings.lua')
local scale = settings.scale('prayer')
conky.config = {
    update_interval = 1,
    minimum_width = math.floor(1100 * scale + 0.5),
    minimum_height = math.floor(255 * scale + 0.5),
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'normal', -- 'panel' can float above applications in Plasma
    own_window_hints = 'undecorated,below,skip_taskbar,skip_pager,sticky',
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    own_window_transparent = true, -- compatibility with older Conky builds
    double_buffer = true,
    lua_load = path .. 'Prayer_Times.lua',
    lua_draw_hook_post = 'main',
    lua_mouse_hook = 'on_mouse', -- requires BUILD_MOUSE_EVENTS
    alignment = 'top_left',
    gap_x = math.floor(settings.number('placement', 'prayer_x', 1930)),
    gap_y = math.floor(settings.number('placement', 'prayer_y', 800)),
}
conky.text = [[ ]]
