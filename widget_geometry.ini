# Shared design canvas for all four native Wayland Conky windows.
# These are the actual unscaled Conky minimum window dimensions, not
# measured Cairo ink bounds. Keep renderer content within these canvases.
# Any edit here affects both Conky window sizes and Python layout calculations.
[prayer]
width = 1100
height = 255
[date]
width = 700
height = 290
[weather]
width = 340
height = 172
[sun_moon]
width = 416
height = 432
