-- Canonical Sun/Moon window: TRANSPARENT CELESTIAL ASTROLABE ONLY.
-- Shares settings.ini, location/data caches and the font with the other widgets.
local path = debug.getinfo(1, 'S').source:match('^@(.*/)') or (os.getenv('HOME') .. '/.config/conky/')
local settings = dofile(path .. 'Settings.lua')
local scale = settings.scale('sun_moon')
conky.config = {
    update_interval = 1,
    font = settings.get('appearance', 'font', 'DejaVu Sans') .. ':size=10',
    minimum_width = math.floor(416 * scale + 0.5),
    minimum_height = math.floor(432 * scale + 0.5),
    own_window = true,
    own_window_class = 'ConkySunMoonAstrolabe',
    own_window_type = 'normal',
    own_window_hints = 'undecorated,below,skip_taskbar,skip_pager,sticky',
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    own_window_transparent = true,
    double_buffer = true,
    lua_load = path .. 'Sun_Moon_Astrolabe.lua',
    lua_draw_hook_post = 'main',
    alignment = 'top_left',
    gap_x = math.floor(settings.number('placement', 'sun_moon_x', 420)),
    gap_y = math.floor(settings.number('placement', 'sun_moon_y', 40)),
}
conky.text = [[ ]]
